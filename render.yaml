services:
  - type: web
    name: chopsticks-arena
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATA_DIR
        value: /var/data
    disk:
      name: arena-database
      mountPath: /var/data
      sizeGB: 1
